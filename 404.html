<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="3; URL=/home" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link rel="icon" href="https://chen-zhe.github.io/favicon.png">
<title>404 Not Found</title>
<style>
body{width:100%;height:100%;margin:0;padding:0;background:#fff;font-family:Segoe UI,sans-serif;letter-spacing:.01em;}
h4{letter-spacing:-.04em;font-weight:700;line-height:1.45em;color:#4a4a4a;margin:1em 0 .5em 0;font-size:1.8rem;}
a,a:active,a:hover,a:visited{cursor:pointer;color:#349ef3;text-decoration:none;}
a:hover{text-decoration:underline;}
@media only screen and (max-width:767px){h4{font-size:1.6rem;}}
@media only screen and (min-width:768px) and (max-width:1023px){h4{font-size:1.65rem;}}
#text-box{position:fixed;text-align:center;z-index:30;top:25%;left:50%;transform:translate(-50%, 0%);display:block;background:#fff;max-width:500px;margin:15px auto;border-radius:3px;padding:30px 0;box-shadow:0 0 5px rgba(0,0,0,.5);}
#text-box #title{margin-top:0;margin-bottom:20px;}
#text-box #content{padding:0 30px;margin:0 0 30px 0;font-size:1.2rem;line-height:1.9em;font-weight:400;color:#5d686f;}
@media only screen and (max-width:767px){#text-box{width:90%;}}
@media only screen and (min-width:768px){#text-box{width:80%;}}
#cover{position:fixed;object-fit:cover;width:100%;height:100%;filter:brightness(80%) blur(3px);}
</style>
</head>
<body>
<div id="text-box">
<h4 id="title">KeyError: 404</h4>
<div id="content">Oops, the URL you requested is not found on this site. You'll be redirected back <a href="/home">home</a> in 3 seconds.</div>
</div>
<img id="cover" src="https://chen-zhe.github.io/home/images/background.jpg" alt="background">
</body>
</html>
